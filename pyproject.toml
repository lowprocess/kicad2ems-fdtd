[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad2ems-fdtd"
dynamic = ["version"]
description = "The FDTD solvers of kicad2ems: openEMS and gfdtd on one shared FDTD model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
authors = [{ name = "Claude", email = "noreply@anthropic.com" }]
dependencies = [
    "kicad2ems>=261028.post1",     # kicad2ems.api.solver 2.1: the solver interface and what an FDTD layer uses
    "numpy>=1.24",
    "shapely>=2.0",
    "emsdev @ https://github.com/lowprocess/emsdev/archive/refs/heads/main.zip",   # gfdtd's GPU in --check
]

[project.optional-dependencies]
# openEMS and CSXCAD are not on PyPI: install them from your distribution or build them from source (kicad2ems's
# README); without them the openems solver loads and reports openEMS as not usable (kicad2ems --check).
openems = ["h5py>=3"]                                                       # openEMS's own Python package needs it
gfdtd = ["gfdtd @ git+https://github.com/lowprocess/gfdtd"]                 # the GPU / CPU-core FDTD engine (its
                                                                            # API_VERSION is checked against gfdtd.py's ENGINE_API)
test = ["pytest>=7"]

# kicad2ems finds its solvers through this group; the engines are this package's own (engines.py)
[project.entry-points."kicad2ems.solvers"]
openems = "kicad2ems_fdtd.openems.plugin:OpenEMS"
gfdtd = "kicad2ems_fdtd.gfdtd:GFDTD"

[tool.setuptools.dynamic]
version = {attr = "kicad2ems_fdtd.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
